<aside class="sidebar" [class.collapsed]="isCollapsed" *ngIf="auth.isAuthenticated$ | async">
  <!-- Toggle Button -->
  <button class="toggle-btn" (click)="toggleSidebar()" [attr.aria-label]="isCollapsed ? 'Proširi meni' : 'Skupi meni'">
    <span class="material-icons">{{ isCollapsed ? 'menu' : 'close' }}</span>
  </button>

  <!-- Navigation Links -->
  <nav class="sidebar-nav">
    <a routerLink="/projekti" routerLinkActive="active" class="nav-item">
      <span class="material-icons">folder</span>
      <span class="nav-text">Projekti</span>
    </a>
    
    <a routerLink="/klijenti" routerLinkActive="active" class="nav-item">
      <span class="material-icons">people</span>
      <span class="nav-text">Klijenti</span>
    </a>
    
    <a routerLink="/kalendar" routerLinkActive="active" class="nav-item">
      <span class="material-icons">calendar_today</span>
      <span class="nav-text">Kalendar</span>
    </a>
    
    <a routerLink="/implementation-models" routerLinkActive="active" class="nav-item">
      <span class="material-icons">build</span>
      <span class="nav-text">Modeli Implementacije</span>
    </a>
    
    <a routerLink="/admin/users" routerLinkActive="active" class="nav-item">
      <span class="material-icons">manage_accounts</span>
      <span class="nav-text">Korisnici</span>
    </a>
    
    <a routerLink="/settings" routerLinkActive="active" class="nav-item">
      <span class="material-icons">settings</span>
      <span class="nav-text">Podešavanja</span>
    </a>
  </nav>
</aside>
