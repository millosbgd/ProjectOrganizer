<aside class="sidebar" [class.collapsed]="isCollapsed" *ngIf="auth.isAuthenticated$ | async">
  <!-- Toggle Button -->
  <button class="toggle-btn" (click)="toggleSidebar()" [attr.aria-label]="isCollapsed ? 'Proširi meni' : 'Skupi meni'">
    <span class="material-icons">{{ isCollapsed ? 'keyboard_arrow_right' : 'keyboard_arrow_left' }}</span>
  </button>

  <!-- Navigation Links -->
  <nav class="sidebar-nav">
    <a *ngFor="let item of visibleMenuItems" [routerLink]="item.route" routerLinkActive="active" class="nav-item">
      <span class="material-icons">{{ item.icon }}</span>
      <span class="nav-text">{{ item.label }}</span>
    </a>
  </nav>
</aside>
