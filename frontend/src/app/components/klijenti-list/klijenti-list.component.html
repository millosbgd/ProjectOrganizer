<div class="klijenti-container">
  <div class="header">
    <h2>Klijenti</h2>
    <button class="btn-icon-primary" routerLink="/klijenti/new" title="Dodaj novog klijenta">➕</button>
  </div>

  <div *ngIf="loading" class="loading">Učitavanje...</div>

  <div *ngIf="!loading && klijenti.length === 0" class="no-data">
    Nema klijenata. Kreirajte novog klijenta.
  </div>

  <div class="table-container" *ngIf="!loading && klijenti.length > 0">
    <table class="data-table">
      <thead>
        <tr>
          <th>Naziv</th>
          <th>Adresa</th>
          <th>Grad</th>
          <th>Zemlja</th>
          <th>Akcije</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let klijent of klijenti">
          <td><strong>{{ klijent.naziv }}</strong></td>
          <td>{{ klijent.adresa }}</td>
          <td>{{ klijent.grad }}</td>
          <td>{{ getCountryName(klijent.zemlja) }}</td>
          <td class="actions">
            <div class="dropdown">
              <button class="btn-dropdown" (click)="toggleDropdown($event, klijent.id)">⋮</button>
              <div class="dropdown-menu" *ngIf="openDropdownId === klijent.id">
                <button class="dropdown-item" [routerLink]="['/klijenti', klijent.id]" title="Izmeni">✏️ Izmeni</button>
                <button class="dropdown-item danger" (click)="deleteKlijent(klijent.id); toggleDropdown($event, klijent.id)" title="Obriši">🗑️ Obriši</button>
              </div>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
