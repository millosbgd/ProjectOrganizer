<div class="klijenti-container">
  <div class="header">
    <h2>Klijenti</h2>
    <button class="btn-primary" routerLink="/klijenti/new">+ Novi Klijent</button>
  </div>

  <div *ngIf="loading" class="loading">Učitavanje...</div>

  <div *ngIf="!loading && klijenti.length === 0" class="no-data">
    Nema klijenata. Kreirajte novog klijenta.
  </div>

  <div class="table-container" *ngIf="!loading && klijenti.length > 0">
    <table class="data-table">
      <thead>
        <tr>
          <th>Naziv</th>
          <th>Adresa</th>
          <th>Grad</th>
          <th>Zemlja</th>
          <th>Akcije</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let klijent of klijenti">
          <td><strong>{{ klijent.naziv }}</strong></td>
          <td>{{ klijent.adresa }}</td>
          <td>{{ klijent.grad }}</td>
          <td>{{ klijent.zemlja }}</td>
          <td class="actions">
            <button class="btn-secondary" [routerLink]="['/klijenti', klijent.id]">
              Izmeni
            </button>
            <button class="btn-danger" (click)="deleteKlijent(klijent.id)">
              Obriši
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
