<div class="klijenti-container">
  <div class="header">
    <h2>Klijenti</h2>
    <button class="btn-icon-minimal" routerLink="/klijenti/new" title="Dodaj novog klijenta">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </div>

  <div *ngIf="loading" class="loading">Učitavanje...</div>

  <div *ngIf="!loading && klijenti.length === 0" class="no-data">
    Nema klijenata. Kreirajte novog klijenta.
  </div>

  <div class="table-container" *ngIf="!loading && klijenti.length > 0">
    <table class="data-table">
      <thead>
        <tr>
          <th>Naziv</th>
          <th>Adresa</th>
          <th>Grad</th>
          <th>Zemlja</th>
          <th>Akcije</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let klijent of klijenti">
          <td><strong>{{ klijent.naziv }}</strong></td>
          <td>{{ klijent.adresa }}</td>
          <td>{{ klijent.grad }}</td>
          <td>{{ getCountryName(klijent.zemlja) }}</td>
          <td class="actions">
            <button class="btn-icon-minimal" [routerLink]="['/klijenti', klijent.id]" title="Izmeni">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </button>
            <button class="btn-icon-minimal danger" (click)="deleteKlijent(klijent.id)" title="Obriši">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
