<div class="calendar-container">
  <div class="header">
    <h2>Kalendar aktivnosti</h2>
    <div class="header-actions">
      <button class="btn-icon-minimal" routerLink="/aktivnosti" title="Prikaži listu aktivnosti">
        <span class="material-icons">checklist</span>
      </button>
    </div>
  </div>
  
  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <div class="calendar-wrapper">
    <full-calendar [options]="calendarOptions()"></full-calendar>
  </div>
</div>

<!-- Activity Edit Modal -->
<app-aktivnost-modal
  [aktivnost]="currentAktivnost"
  [isOpen]="showAktivnostModal"
  [isProjectLocked]="false"
  (save)="saveAktivnost($event)"
  (close)="closeAktivnostModal()"
  (delete)="onAktivnostDeleted($event)"
  (refreshNeeded)="refreshCalendar()">
</app-aktivnost-modal>

<app-bau-batch-modal
  [isOpen]="showBauBatchModal"
  [datum]="selectedDay"
  [klijenti]="klijenti"
  [bauTypes]="bauTypes"
  (close)="closeBauBatchModal()"
  (saved)="onBauBatchSaved()">
</app-bau-batch-modal>
