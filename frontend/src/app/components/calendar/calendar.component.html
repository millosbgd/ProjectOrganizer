<div class="calendar-container">
  <div class="header">
    <h2>Kalendar aktivnosti</h2>
  </div>
  
  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <div class="calendar-wrapper">
    <full-calendar [options]="calendarOptions()"></full-calendar>
  </div>
</div>

<!-- Activity Edit Modal -->
<app-aktivnost-modal
  [aktivnost]="currentAktivnost"
  [isOpen]="showAktivnostModal"
  (save)="saveAktivnost($event)"
  (close)="closeAktivnostModal()">
</app-aktivnost-modal>
