<div class="modal-backdrop" *ngIf="isOpen" (click)="onBackdropClick($event)">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Ažuriranje stavke implementacije</h3>
      <button class="close-btn" (click)="onClose()">&times;</button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label>Stavka:</label>
        <div class="item-name">{{ item?.implementationItemNaziv || 'Bez naziva' }}</div>
      </div>

      <div class="form-group">
        <label>Napomena:</label>
        <textarea 
          [(ngModel)]="item!.napomena" 
          name="napomena" 
          rows="6"
          placeholder="Unesite napomenu..."
        ></textarea>
      </div>

      <div class="form-group checkbox-group">
        <label>
          <input 
            type="checkbox" 
            [(ngModel)]="item!.zavrseno" 
            (change)="onZavrsenoChange()"
            name="zavrseno"
          />
          Završeno
        </label>
      </div>

      <div class="form-group" *ngIf="item?.zavrseno">
        <label>Datum završetka: <span class="required">*</span></label>
        <input 
          type="date" 
          [(ngModel)]="zavrsenoDatumString" 
          name="zavrsenoDatum"
          [required]="zavrsenoDateRequired"
        />
      </div>

      <div class="form-group checkbox-group">
        <label>
          <input 
            type="checkbox" 
            [(ngModel)]="item!.klijentPotvrdio" 
            (change)="onKlijentPotvrdioChange()"
            name="klijentPotvrdio"
          />
          Klijent potvrdio
        </label>
      </div>

      <div class="form-group" *ngIf="item?.klijentPotvrdio">
        <label>Datum potvrde klijenta: <span class="required">*</span></label>
        <input 
          type="date" 
          [(ngModel)]="klijentPotvrdioDatumString" 
          name="klijentPotvrdioDatum"
          [required]="klijentPotvrdioDateRequired"
        />
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" (click)="onClose()">Otkaži</button>
      <button class="btn-primary" (click)="onSave()">Sačuvaj</button>
    </div>
  </div>
</div>
