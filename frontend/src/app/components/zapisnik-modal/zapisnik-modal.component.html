<div class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>{{ title }}</h3>
      <button class="close-btn" (click)="closeModal()">&times;</button>
    </div>
    
    <div class="modal-body">
      <div *ngIf="isGenerating" class="loading">
        <div class="spinner"></div>
        <p *ngIf="title.includes('Zapisnik')">AI generiše zapisnik...</p>
        <p *ngIf="title.includes('DevOps')">AI generiše taskove...</p>
      </div>

      <div *ngIf="!isGenerating && zapisnik" class="zapisnik-content">
        <pre>{{ zapisnik }}</pre>
      </div>
    </div>
    
    <div class="modal-footer" *ngIf="!isGenerating && zapisnik">
      <button class="btn-secondary" (click)="closeModal()">Zatvori</button>
      <button class="btn-primary" (click)="copyToClipboard()">📋 Kopiraj u Clipboard</button>
      <button 
        *ngIf="title.includes('DevOps')" 
        class="btn-preview" 
        (click)="openPreview()"
      >
        📥 Pregledaj i sačuvaj
      </button>
    </div>
  </div>
</div>
