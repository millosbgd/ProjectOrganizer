<div class="modal-backdrop" *ngIf="isOpen" (click)="onBackdropClick($event)">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="header-content">
        <h3>{{ sablon.id && sablon.id > 0 ? 'Izmena šablona za podršku' : 'Novi šablon za podršku' }}</h3>
      </div>
      <button class="close-btn" (click)="onClose()">&times;</button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label>Klijent:</label>
        <select [(ngModel)]="sablon.klijentId" name="klijentId">
          <option [ngValue]="null">- Bez klijenta -</option>
          <option *ngFor="let klijent of klijenti" [ngValue]="klijent.id">
            {{ klijent.naziv }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>Naslov: *</label>
        <input
          [(ngModel)]="sablon.naslov"
          name="naslov"
          maxlength="2000"
          required />
        <div class="char-count">{{ sablon.naslov.length || 0 }}/2000</div>
      </div>

      <div class="form-group">
        <label>Opis zahteva za podršku:</label>
        <textarea
          [(ngModel)]="sablon.opisZahteva"
          name="opisZahteva"
          rows="4"
          maxlength="2000"></textarea>
        <div class="char-count">{{ sablon.opisZahteva.length || 0 }}/2000</div>
      </div>

      <div class="form-group">
        <label>Opis rešenja: *</label>
        <textarea
          [(ngModel)]="sablon.opisResenja"
          name="opisResenja"
          rows="4"
          maxlength="2000"
          required></textarea>
        <div class="char-count">{{ sablon.opisResenja.length || 0 }}/2000</div>
      </div>

      <div class="form-group">
        <label>Odgovor klijentu:</label>
        <textarea
          [(ngModel)]="sablon.odgovorKlijentu"
          name="odgovorKlijentu"
          rows="4"
          maxlength="2000"></textarea>
        <div class="char-count">{{ sablon.odgovorKlijentu.length || 0 }}/2000</div>
      </div>
    </div>

    <div class="modal-footer">
      <div class="error-message" *ngIf="validationError">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        {{ validationError }}
      </div>
      <div class="footer-buttons">
        <button type="button" class="btn-primary" (click)="onSave()" [disabled]="isSaving">
          {{ isSaving ? 'Čuvam...' : 'Sačuvaj' }}
        </button>
        <button type="button" class="btn-secondary" (click)="onClose()">Otkaži</button>
        <button
          type="button"
          class="btn-icon-minimal danger"
          (click)="onDelete()"
          *ngIf="sablon.id && sablon.id > 0"
          title="Obriši šablon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
