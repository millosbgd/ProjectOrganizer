<div class="aktivnosti-container">
  <div class="header">
    <h2>Aktivnosti</h2>
    <div class="header-actions">
      <button 
        class="btn-filter" 
        (click)="toggleShowAll()" 
        [title]="showAllActivities ? 'Prikaži moje aktivnosti' : 'Prikaži sve aktivnosti'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path *ngIf="!showAllActivities" d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle *ngIf="!showAllActivities" cx="9" cy="7" r="4"></circle>
          <path *ngIf="showAllActivities" d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle *ngIf="showAllActivities" cx="9" cy="7" r="4"></circle>
          <path *ngIf="showAllActivities" d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path *ngIf="showAllActivities" d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>{{ showAllActivities ? 'Prikaži moje aktivnosti' : 'Prikaži sve aktivnosti' }}</span>
      </button>
      <button class="btn-icon-minimal" (click)="addNewAktivnost()" title="Dodaj novu aktivnost">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="loading">Učitavanje...</div>

  <div *ngIf="!loading && aktivnosti.length === 0" class="no-data">
    {{ showAllActivities ? 'Nema aktivnosti.' : 'Nemate aktivnosti.' }}
  </div>

  <div class="table-container" *ngIf="!loading && aktivnosti.length > 0">
    <table class="aktivnosti-table">
      <thead>
        <tr>
          <th>Opis</th>
          <th>Detalji</th>
          <th>Projekat</th>
          <th>Datum</th>
          <th>Status</th>
          <th class="actions-column">Akcije</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let aktivnost of aktivnosti">
          <td class="opis-column">{{ aktivnost.opis }}</td>
          <td class="detalji-column">
            <span class="detalji-text" [title]="aktivnost.detalji">
              {{ aktivnost.detalji }}
            </span>
          </td>
          <td>
            <span *ngIf="aktivnost.projekat" class="projekat-link">
              {{ aktivnost.projekat.naziv }}
            </span>
            <span *ngIf="aktivnost.bau" class="bau-badge">BAU</span>
            <span *ngIf="!aktivnost.projekat && !aktivnost.bau" class="no-projekat">-</span>
          </td>
          <td class="datum-column">{{ formatDate(aktivnost.datum) }}</td>
          <td>
            <span class="status-badge" [ngClass]="'status-' + aktivnost.status.toLowerCase()">
              {{ aktivnost.status }}
            </span>
          </td>
          <td class="actions-column">
            <button class="btn-icon-minimal" (click)="editAktivnost(aktivnost)" title="Izmeni">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </button>
            <button class="btn-icon-minimal danger" (click)="deleteAktivnost(aktivnost.id)" title="Obriši">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal for Add/Edit Aktivnost -->
<app-aktivnost-modal
  [isOpen]="isModalOpen"
  [aktivnost]="selectedAktivnost"
  [isProjectLocked]="false"
  (save)="onModalSave($event)"
  (close)="onModalClose()"
  (delete)="onModalDelete($event)"
></app-aktivnost-modal>
