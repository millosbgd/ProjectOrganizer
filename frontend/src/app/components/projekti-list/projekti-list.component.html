<div class="projekti-container">
  <div class="header">
    <h2>Projekti</h2>
    <button class="btn-primary" routerLink="/projekti/new">+ Novi Projekat</button>
  </div>

  <div *ngIf="loading" class="loading">Učitavanje...</div>

  <div *ngIf="!loading && projekti.length === 0" class="no-data">
    Nema projekata. Kreirajte novi projekat.
  </div>

  <div class="projekti-grid" *ngIf="!loading && projekti.length > 0">
    <div class="projekat-card" *ngFor="let projekat of projekti" [routerLink]="['/projekti', projekat.id]">
      <div class="card-header">
        <h3>{{ projekat.naziv }}</h3>
        <span class="badge" [class.active]="projekat.aktivan" [class.inactive]="!projekat.aktivan">
          {{ projekat.aktivan ? 'Aktivan' : 'Neaktivan' }}
        </span>
      </div>
      <div class="card-body">
        <p><strong>Broj:</strong> {{ projekat.brojProjekta }}</p>
        <p><strong>Datum:</strong> {{ projekat.datum | date:'dd.MM.yyyy' }}</p>
        <p><strong>Status:</strong> {{ projekat.status }}</p>
        <p *ngIf="projekat.klijent"><strong>Klijent:</strong> {{ projekat.klijent.naziv }}</p>
      </div>
      <div class="card-footer">
        <button class="btn-secondary" [routerLink]="['/projekti', projekat.id]" (click)="$event.stopPropagation()">
          Detalji
        </button>
        <button class="btn-danger" (click)="deleteProjekt(projekat.id); $event.stopPropagation()">
          Obriši
        </button>
      </div>
    </div>
  </div>
</div>
