<div class="projekti-container">
  <div class="header">
    <h2>Projekti</h2>
    <button class="btn-icon-minimal" routerLink="/projekti/new" title="Dodaj novi projekat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </div>

  <div *ngIf="loading" class="loading">Učitavanje...</div>

  <div *ngIf="!loading && projekti.length === 0" class="no-data">
    Nema projekata. Kreirajte novi projekat.
  </div>

  <div class="projekti-grid" *ngIf="!loading && projekti.length > 0">
    <div class="projekat-card" *ngFor="let projekat of projekti" [routerLink]="['/projekti', projekat.id]">
      <div class="card-header">
        <h3>{{ projekat.naziv }}</h3>
        <span class="badge" [class.active]="projekat.aktivan" [class.inactive]="!projekat.aktivan">
          {{ projekat.aktivan ? 'Aktivan' : 'Neaktivan' }}
        </span>
      </div>
      <div class="card-body">
        <p><strong>Broj:</strong> {{ projekat.brojProjekta }}</p>
        <p><strong>Datum:</strong> {{ projekat.datum | date:'dd.MM.yyyy' }}</p>
        <p><strong>Status:</strong> {{ projekat.status }}</p>
        <p *ngIf="projekat.klijent"><strong>Klijent:</strong> {{ projekat.klijent.naziv }}</p>
      </div>
      <div class="card-footer">
        <div class="dropdown">
          <button class="btn-dropdown" (click)="toggleDropdown($event, projekat.id)">⋮</button>
          <div class="dropdown-menu" *ngIf="openDropdownId === projekat.id">
            <button class="dropdown-item" [routerLink]="['/projekti', projekat.id]" title="Detalji">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
              Detalji
            </button>
            <button class="dropdown-item danger" (click)="deleteProjekt(projekat.id); toggleDropdown($event, projekat.id)" title="Obriši">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
              Obriši
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
