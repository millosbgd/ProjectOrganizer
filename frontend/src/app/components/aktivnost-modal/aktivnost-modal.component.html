<div class="modal-backdrop" *ngIf="isOpen" (click)="onBackdropClick($event)">
  <div class="modal-content">
    <div class="modal-header">
      <div class="header-content">
        <span *ngIf="aktivnost.bau" class="bau-badge" title="Business As Usual - Aktivnost koja nije vezana za projekat">
          BAU
        </span>
        <h3 *ngIf="!aktivnost.bau && aktivnost.projekatId != null && aktivnost.projekatId > 0">{{ getProjektNaziv() }}</h3>
      </div>
      <button class="close-btn" (click)="onClose()">&times;</button>
    </div>

    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label class="checkbox-label">
            <input 
              type="checkbox" 
              [(ngModel)]="aktivnost.bau" 
              (change)="onBauChange()"
              [disabled]="isProjectLocked"
              name="bau" 
            />
            <span class="checkbox-text">
              Business As Usual (BAU)
            </span>
          </label>
        </div>
      </div>

      <div class="form-group" *ngIf="!aktivnost.bau">
        <label>Projekat: *</label>
        <select 
          [(ngModel)]="aktivnost.projekatId" 
          (change)="onProjekatChange()"
          [disabled]="isProjectLocked"
          name="projekat" 
          required>
          <option [ngValue]="0">- Izaberite projekat -</option>
          <option *ngFor="let projekat of projekti" [ngValue]="projekat.id">
            {{ projekat.brojProjekta }} - {{ projekat.naziv }}
          </option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Datum:</label>
          <input type="date" [(ngModel)]="datumString" name="datum" required />
        </div>

        <div class="form-group">
          <label>Status:</label>
          <select [(ngModel)]="aktivnost.status" name="status">
            <option value="Planirana">Planirana</option>
            <option value="U toku">U toku</option>
            <option value="Završena">Završena</option>
            <option value="Odložena">Odložena</option>
          </select>
        </div>

        <div class="form-group">
          <label>Vrsta:</label>
          <select [(ngModel)]="aktivnost.vrsta" name="vrsta">
            <option value="Razvoj">Razvoj</option>
            <option value="Testiranje">Testiranje</option>
            <option value="Sastanak">Sastanak</option>
            <option value="Dokumentacija">Dokumentacija</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Stavka implementacije:</label>
        <select [(ngModel)]="aktivnost.projectImplementationItemId" name="projectImplementationItemId">
          <option [ngValue]="null">- Nije povezano sa stavkom -</option>
          <option *ngFor="let item of implementationItems" [ngValue]="item.id">
            {{ item.implementationItemNaziv || 'Stavka bez naziva' }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>Opis:</label>
        <textarea class="opis-textarea" [(ngModel)]="aktivnost.opis" name="opis" rows="1" required></textarea>
      </div>

      <div class="form-group">
        <div class="detalji-header">
          <label>Detalji:</label>
          <div class="ai-buttons">
            <button type="button" class="btn-ai-small btn-ai-minimal" (click)="triggerFileInput()" title="Učitaj sliku i očitaj tekst">
              OCR skeniraj sliku
            </button>
            <input 
              #fileInput 
              type="file" 
              accept="image/*" 
              (change)="onImageSelected($event)" 
              style="display: none"
            />
            <button type="button" class="btn-ai-small btn-ai-minimal" (click)="generateZapisnik()" *ngIf="aktivnost.id">
              Generiši zapisnik
            </button>
            <button type="button" class="btn-ai-small btn-ai-minimal" (click)="generateDevOpsTasks()" *ngIf="aktivnost.id">
              Generiši taskove
            </button>
            <button type="button" class="btn-ai-small btn-ai-minimal" (click)="openDevOpsTasksModal()" *ngIf="aktivnost.id" title="Pogledaj sačuvane taskove">
              Sačuvani taskovi
            </button>
          </div>
        </div>
        <div class="image-preview" *ngIf="selectedImagePreview">
          <img [src]="selectedImagePreview" alt="Preview" />
          <button type="button" class="btn-remove-image" (click)="removeImage()" title="Ukloni sliku">×</button>
          <button type="button" class="btn-extract-text" (click)="extractTextFromImage()" [disabled]="isExtractingText">
            {{ isExtractingText ? '⏳ Očitavam...' : '📝 Očitaj tekst' }}
          </button>
        </div>
        <textarea
          class="detalji-textarea"
          [(ngModel)]="aktivnost.detalji"
          name="detalji"
          rows="8"
          maxlength="2000"
          required
        ></textarea>
        <div class="char-count">{{ aktivnost.detalji.length || 0 }}/2000</div>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn-primary" (click)="onSave()">Sačuvaj</button>
      <button type="button" class="btn-secondary" (click)="onClose()">Otkaži</button>
    </div>
  </div>
</div>

<app-zapisnik-modal
  *ngIf="showZapisnikModal"
  [title]="zapisnikModalTitle"
  [zapisnik]="zapisnik"
  [isGenerating]="isGeneratingZapisnik"
  (close)="closeZapisnikModal()"
  (preview)="openPreview()"
></app-zapisnik-modal>

<app-devops-tasks-modal
  *ngIf="showDevOpsTasksModal"
  [aktivnostId]="aktivnost.id"
  (close)="closeDevOpsTasksModal()"
></app-devops-tasks-modal>

<app-devops-tasks-preview-modal
  *ngIf="showDevOpsTasksPreviewModal"
  [tasks]="parsedTasks"
  [aktivnostId]="aktivnost.id"
  (close)="closePreviewModal()"
  (save)="saveSelectedTasks($event)"
></app-devops-tasks-preview-modal>
