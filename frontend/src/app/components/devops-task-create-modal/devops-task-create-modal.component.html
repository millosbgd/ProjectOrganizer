<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-content">

    <!-- Zaglavlje sa URL poljem -->
    <div class="modal-header">
      <div class="header-main">
        <h3>Novi DevOps Task</h3>
        <button class="close-btn" (click)="onClose()">&times;</button>
      </div>

      <div class="url-import-bar">
        <div class="url-input-wrapper">
          <svg class="url-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          <input
            type="text"
            class="url-input"
            [(ngModel)]="devOpsUrl"
            (ngModelChange)="onUrlChange()"
            (paste)="onUrlPaste($event)"
            placeholder="Nalepite Azure DevOps link taska (opciono)..."
            name="devOpsUrl"
          />
          <button
            *ngIf="devOpsUrl"
            class="clear-url-btn"
            (click)="clearUrl()"
            title="Ukloni link"
          >&times;</button>
        </div>
        <button
          class="btn-fetch"
          (click)="fetchFromUrl()"
          [disabled]="!devOpsUrl || fetchLoading"
        >
          <span *ngIf="!fetchLoading">Učitaj</span>
          <span *ngIf="fetchLoading" class="spinner-inline"></span>
        </button>
      </div>

      <div *ngIf="fetchError" class="fetch-error">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        {{ fetchError }}
      </div>

      <div *ngIf="form.devOpsWorkItemId && !fetchLoading" class="fetch-success">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        Učitan work item
        <strong>#{{ form.devOpsWorkItemId }}</strong>
        <span *ngIf="workItemType" class="work-item-type">{{ workItemType }}</span>
      </div>
    </div>

    <!-- Forma -->
    <div class="modal-body">
      <div class="form-group">
        <label>Naziv: <span class="required">*</span></label>
        <input
          type="text"
          [(ngModel)]="form.title"
          name="title"
          placeholder="Unesite naziv taska..."
          [class.input-error]="!form.title"
          required
        />
      </div>

      <div class="form-group">
        <label>Opis:</label>
        <textarea
          [(ngModel)]="form.description"
          name="description"
          rows="4"
          placeholder="Unesite opis taska..."
        ></textarea>
      </div>

      <div class="form-group">
        <label>Acceptance Criteria:</label>
        <textarea
          [(ngModel)]="form.acceptanceCriteria"
          name="acceptanceCriteria"
          rows="4"
          placeholder="Unesite acceptance criteria..."
        ></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Prioritet:</label>
          <input
            type="text"
            [(ngModel)]="form.priority"
            name="priority"
            placeholder="npr. High, Medium, Low"
          />
        </div>

        <div class="form-group">
          <label>Procena:</label>
          <input
            type="text"
            [(ngModel)]="form.estimation"
            name="estimation"
            placeholder="npr. 5h, 2 sp"
          />
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" (click)="onClose()">Otkaži</button>
      <button class="btn-primary" (click)="onSave()" [disabled]="!form.title?.trim() || saving">
        {{ saving ? 'Čuvanje...' : 'Sačuvaj task' }}
      </button>
    </div>

  </div>
</div>
